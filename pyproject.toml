[project]
name = "climate-monitor"
version = "0.1.0"
description = "Tapo T315 溫溼度感測器資料收集器，透過 H200 網關通訊，儲存於 CrateDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-kasa>=0.9.0",
    "crate>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
climate-monitor = "climate_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
