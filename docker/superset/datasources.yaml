databases:
  - database_name: Climate Data (CrateDB)
    sqlalchemy_uri: crate://crate@cratedb:4200
    expose_in_sqllab: true
    allow_run_async: false
    tables:
      - table_name: sensor_readings
        schema: doc
        description: "Climate Sensor Data"
        columns:
          - column_name: ts
            expression: "timezone('Asia/Taipei', ts)"
            type: TIMESTAMP
            is_dttm: true
            python_date_format: "epoch_ms"
            verbose_name: "Time"
          - column_name: device_id
            type: STRING
          - column_name: device_name
            type: STRING
          - column_name: temperature
            type: FLOAT
          - column_name: humidity
            type: FLOAT
          - column_name: battery_level
            type: INTEGER
          - column_name: rssi
            type: INTEGER
          - column_name: is_valid
            type: BOOLEAN
            verbose_name: "Valid"
          - column_name: stale_reasons
            type: STRING
            verbose_name: "Stale Reasons"
          - column_name: failed_checks
            type: INTEGER
            verbose_name: "Failed Checks"
          - column_name: check_rssi_weak
            type: BOOLEAN
            verbose_name: "RSSI Weak"
          - column_name: check_rssi_frozen
            type: BOOLEAN
            verbose_name: "RSSI Frozen"
          - column_name: check_temp_frozen
            type: BOOLEAN
            verbose_name: "Temp Frozen"
          - column_name: check_time_frozen
            type: BOOLEAN
            verbose_name: "Time Frozen"
